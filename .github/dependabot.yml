version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for everything that should be safe; a major version arrives alone so its CI result
    # and changelog say something about that package.
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # svelte-check and astro check cannot run on the TypeScript 7 native compiler yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3
