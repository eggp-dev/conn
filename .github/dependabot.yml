version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 0 = no version-update pull requests. Security updates still arrive. Raise it when you want them back.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for everything that should be safe; a major version arrives alone so its CI result
    # and changelog say something about that package.
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # svelte-check and astro check cannot run on the TypeScript 7 native compiler yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @remotion/eslint-config-flat pins typescript-eslint 8, whose peer range stops at eslint 9.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    # 0 = no version-update pull requests. Security updates still arrive. Raise it when you want them back.
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # 0.9 fails on Windows: the configured environment never reaches the shell
      # (crates/core/tests/profiles.rs, native_profile_launches_with_environment_...). Needs a Windows debugger.
      - dependency-name: portable-pty
        versions: ['0.9.x']
    # 0 = no version-update pull requests. Security updates still arrive. Raise it when you want them back.
    open-pull-requests-limit: 0
