name: Set up Conn build
description: Install the pinned frontend runtime and native desktop dependencies
inputs:
  desktop:
    description: Install Linux desktop libraries
    default: 'false'
  rust-cache:
    description: Restore compiled dependencies from earlier CI runs. Never set for release builds, which compile from scratch.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Linux desktop libraries
      if: runner.os == 'Linux' && inputs.desktop == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev
    - name: Pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - name: Compiled Rust dependencies from earlier runs
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # The CLI sidecar builds into the root target directory, the desktop shell into its own.
        workspaces: |
          . -> target
          frontends/tauri/src-tauri -> target
        # Pull requests read the cache that main wrote; they do not each write their own.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Frontend dependencies
      shell: bash
      working-directory: frontends/tauri
      run: npm ci
