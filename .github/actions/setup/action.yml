name: Set up Conn build
description: Install the pinned frontend runtime and native desktop dependencies
inputs:
  desktop:
    description: Install Linux desktop libraries
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Linux desktop libraries
      if: runner.os == 'Linux' && inputs.desktop == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev
    - name: Pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - name: Frontend dependencies
      shell: bash
      working-directory: frontends/tauri
      run: npm ci
