name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.8.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate existing tag on main
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          release_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" origin/main
          git checkout --detach "$release_sha"
          python scripts/release.py check --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  build:
    needs: validate
    # Release secrets are never available to pull requests or manual branch runs.
    if: github.repository == 'eggp-dev/conn' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the oldest intended Ubuntu baseline; do not use the 26.04 dev host.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CONN_UPDATER_ENABLED: '1'
      CONN_RELEASE_CHANNEL: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure updater public key
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: python scripts/updater_artifacts.py config --out frontends/tauri/src-tauri/tauri.updater.release.json
      - name: Prepare private macOS signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/macos_sign.py prepare --state "${{ runner.temp }}/conn-macos-signing"
      - name: Build Linux or Windows CLI sidecar and desktop installer
        if: runner.os != 'macOS'
        working-directory: frontends/tauri
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.release.json
      - name: Build, sign and notarize macOS app and sidecar
        if: runner.os == 'macOS'
        working-directory: frontends/tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        # Keep the signed app for final verification; dmg alone removes it.
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.release.json
      - name: Verify macOS signatures, notarize CLI and DMG, and package
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python scripts/macos_sign.py finish --state "${{ runner.temp }}/conn-macos-signing" --target ${{ matrix.target }} --out release-artifacts
      - name: Package Linux or Windows assets
        if: runner.os != 'macOS'
        run: python scripts/release.py package --target ${{ matrix.target }} --out release-artifacts
      - name: Sign final updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/updater_artifacts.py package --target ${{ matrix.target }} --out release-artifacts
      - name: Verify updater signatures against the embedded public key
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          CONN_UPDATER_ARTIFACTS: ${{ github.workspace }}/release-artifacts
        # From src-tauri so Cargo reuses the target directory the Tauri build just filled.
        working-directory: frontends/tauri/src-tauri
        run: cargo test --release --target ${{ matrix.target }} --locked --lib update_tests::release_payload_signatures_match_the_embedded_key -- --ignored --exact
      - name: Run standalone packaged CLI on its native runner
        run: python scripts/release.py smoke --target ${{ matrix.target }} --artifacts release-artifacts
      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: python scripts/macos_sign.py cleanup --state "${{ runner.temp }}/conn-macos-signing"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conn-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: [validate, checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: conn-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete matrix and calculate checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python scripts/release.py finalize --artifacts release-artifacts --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python scripts/release.py draft --artifacts release-artifacts --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
