name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to validate for release
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  # Documentation and UI changes do not need three native builds. Releases, manual
  # runs, the `full-ci` label and anything this step cannot classify get everything.
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RELEASE_REF: ${{ inputs.ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          all='["ubuntu-24.04","macos-15","windows-2022"]'
          full() { echo "Full matrix: $1"; { echo "rust=$all"; echo "desktop=$all"; } >> "$GITHUB_OUTPUT"; exit 0; }
          # A reusable call reports its caller's event, so a release is recognized by its ref.
          [ -z "$RELEASE_REF" ] || full "release validation"
          [ "$EVENT" = pull_request ] || [ "$EVENT" = push ] || full "manual run"
          [ "$FULL_LABEL" != true ] || full "full-ci label"
          [ "$EVENT" != push ] || [ "$GITHUB_REF" = refs/heads/main ] || full "push outside main"
          [ -f scripts/ci_scope.py ] || full "no scope script at this revision"
          base=""
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git fetch --quiet --depth=1 origin "$BEFORE"; then base="$BEFORE"; fi
          # A pull request is checked out as its merge commit; its first parent is the base branch.
          if [ -z "$base" ] && git rev-parse --quiet --verify 'HEAD^1' > /dev/null; then base='HEAD^1'; fi
          if [ -z "$base" ] || ! git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"; then
            python3 scripts/ci_scope.py --event "$EVENT" --unknown-diff | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed paths:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          python3 scripts/ci_scope.py --event "$EVENT" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
  quality:
    name: Docs, release tooling and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/release.py check
      - run: python scripts/check_repo.py
      - name: The one-line installer parses under a POSIX shell and refuses a bad version
        run: |
          sh -n scripts/install.sh
          ! CONN_VERSION="latest" sh scripts/install.sh > /dev/null 2>&1
      - run: python -m unittest discover -s tests/release -v
      - run: npm run test:ui
      - run: node scripts/check-ui-boundaries.mjs
      - run: node scripts/generate-owner-contract.mjs --check
      - name: Core and renderer screen parity
        run: npm run test:screen
        working-directory: packages/ui
      - run: npm run build
        working-directory: frontends/tauri
      - run: npm run build:web
      - name: The website builds, including the pages it generates from docs/
        run: npm ci && npm run build
        working-directory: site
      - name: The film project still type-checks (Dependabot updates it through the shared lockfile)
        run: npm ci && npm run check
        working-directory: media/demo
  core:
    name: Rust (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # The release gate (inputs.ref set) compiles from scratch; everything else reuses what main compiled.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.ref == ''
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace default members: every crate except the desktop shell, which needs the webview toolchain.
      - run: cargo test --locked
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
          rust-cache: ${{ inputs.ref == '' }}
      - name: Build Linux or Windows desktop
        if: runner.os != 'macOS'
        run: npm run tauri build -- --debug --no-bundle
        working-directory: frontends/tauri
      - name: Build ad-hoc macOS app with scripting resources
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --debug --bundles app
        working-directory: frontends/tauri
      - name: Native desktop unit tests
        # From src-tauri so Cargo reuses the target directory the Tauri build just filled.
        run: cargo test --lib --locked
        working-directory: frontends/tauri/src-tauri
      - name: Check macOS scripting metadata and compile external automation examples
        if: runner.os == 'macOS'
        run: python3 scripts/check_macos_scripting.py --app frontends/tauri/src-tauri/target/debug/bundle/macos/Conn.app
  collaboration:
    name: Collaboration browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.ref == ''
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the lockfile-pinned test browser
        run: npx playwright install chromium --with-deps
        working-directory: tests/collaboration
      - run: cargo build --locked -p conn-web -p conn
      - run: npm run build:web
      - run: npm run test:checkpoint -w @conn/ui
      - run: npm run test:app-lifetime -w @conn/ui
      - run: npm run test:collaboration
      - run: npm run test:input -w @conn/collaboration-tests
      - run: npm run package:web -- --debug
  required:
    name: Required checks
    if: always()
    needs: [scope, quality, core, desktop, collaboration]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job in scope passed
        env:
          SCOPE: ${{ needs.scope.result }}
          QUALITY: ${{ needs.quality.result }}
          COLLABORATION: ${{ needs.collaboration.result }}
          CORE: ${{ needs.core.result }}
          DESKTOP: ${{ needs.desktop.result }}
          RUST_RUNNERS: ${{ needs.scope.outputs.rust }}
          DESKTOP_RUNNERS: ${{ needs.scope.outputs.desktop }}
        run: |
          # A job may be skipped only because the scope left it nothing to do.
          expected() { if [ "$1" = '[]' ]; then test "$2" = skipped; else test "$2" = success; fi; }
          test "$SCOPE" = success && test "$QUALITY" = success && test "$COLLABORATION" = success
          expected "$RUST_RUNNERS" "$CORE" && expected "$DESKTOP_RUNNERS" "$DESKTOP"
