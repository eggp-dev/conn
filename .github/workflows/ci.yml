name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to validate for release
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  quality:
    name: Docs, release tooling and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/release.py check
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests/release -v
      - run: npm test
        working-directory: frontends/tauri
      - run: npm run build
        working-directory: frontends/tauri
  core:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Linux credential-store build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo test --workspace --locked
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Build Linux or Windows desktop
        if: runner.os != 'macOS'
        run: npm run tauri build -- --debug --no-bundle
        working-directory: frontends/tauri
      - name: Build ad-hoc macOS app with scripting resources
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --debug --bundles app
        working-directory: frontends/tauri
      - name: Native desktop unit tests
        run: cargo test --manifest-path frontends/tauri/src-tauri/Cargo.toml --lib --locked
      - name: Check macOS scripting metadata and compile external automation examples
        if: runner.os == 'macOS'
        run: python3 scripts/check_macos_scripting.py --app frontends/tauri/src-tauri/target/debug/bundle/macos/Conn.app
  required:
    name: Required checks
    if: always()
    needs: [quality, core, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          QUALITY: ${{ needs.quality.result }}
          CORE: ${{ needs.core.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$QUALITY" = success && test "$CORE" = success && test "$DESKTOP" = success
