[package]
name = "conn-desktop"
version = "0.5.1"
edition = "2021"
description = "A shared terminal for humans and AI agents."
repository = "https://github.com/eggplantiny/conn"
homepage = "https://github.com/eggplantiny/conn"
license = "MIT"

# Standalone: not a member of the repo workspace so `cargo test` at the root stays light.
[workspace]

[lib]
name = "conn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
parking_lot = "0.12"
conn-core = { path = "../../../crates/core" }

conn-frontend = { path = "../../../crates/frontend" }
