<svg xmlns="http://www.w3.org/2000/svg" width="720" height="758" viewBox="0 0 560 590" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">제어권을 주고받는 방법</title>
  <desc id="desc">Conn 협업 흐름: 제어권 요청, 실제 요청 검토, 허용 또는 거절, 제어권 회수, 타임라인 확인.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181a24"/><stop offset="1" stop-color="#101217"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5baff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="588" rx="22" fill="url(#surface)" stroke="#343744"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK KR', sans-serif">
    <g transform="translate(470 25) scale(.87)" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"><path d="M44 16 A21 21 0 1 0 44 48"/><rect x="42" y="26" width="8" height="12" rx="4" stroke="none" fill="#eeeaff"/></g>
    <text x="28" y="49" fill="#f2f0f7" font-size="29" font-weight="650">제어권을 주고받는 방법</text>
    <text x="28" y="78" fill="#a8aab8" font-size="19">다섯 단계. 하나의 터미널.</text>
    <path d="M44 150 V493" fill="none" stroke="#464959" stroke-width="2"/>
    <rect x="72" y="104" width="460" height="74" rx="13" fill="#1a1d27" stroke="#343744"/>
    <rect x="72" y="122" width="3" height="38" rx="1.5" fill="#b5aaff"/>
    <circle cx="44" cy="141" r="15" fill="#171a23" stroke="#b5aaff" stroke-width="1.5"/>
    <text x="44" y="146" text-anchor="middle" fill="#b5aaff" font-size="14" font-weight="650">01</text>
    <text x="92" y="133" fill="#f2f0f7" font-size="23" font-weight="650">제어권 요청</text>
    <text x="92" y="159" fill="#b3b5c3" font-size="18">에이전트가 이유와 예정 명령을 보냅니다.</text>
    <rect x="72" y="191" width="460" height="74" rx="13" fill="#1a1d27" stroke="#343744"/>
    <rect x="72" y="209" width="3" height="38" rx="1.5" fill="#a8b9eb"/>
    <circle cx="44" cy="228" r="15" fill="#171a23" stroke="#a8b9eb" stroke-width="1.5"/>
    <text x="44" y="233" text-anchor="middle" fill="#a8b9eb" font-size="14" font-weight="650">02</text>
    <text x="92" y="220" fill="#f2f0f7" font-size="23" font-weight="650">실제 요청 검토</text>
    <text x="92" y="246" fill="#b3b5c3" font-size="18">원래 메서드와 인자를 직접 확인합니다.</text>
    <rect x="72" y="278" width="460" height="74" rx="13" fill="#1a1d27" stroke="#343744"/>
    <rect x="72" y="296" width="3" height="38" rx="1.5" fill="#eabb78"/>
    <circle cx="44" cy="315" r="15" fill="#171a23" stroke="#eabb78" stroke-width="1.5"/>
    <text x="44" y="320" text-anchor="middle" fill="#eabb78" font-size="14" font-weight="650">03</text>
    <text x="92" y="307" fill="#f2f0f7" font-size="23" font-weight="650">허용 또는 거절</text>
    <text x="92" y="333" fill="#b3b5c3" font-size="18">직접 결정하고, 실행은 정책을 따릅니다.</text>
    <rect x="72" y="365" width="460" height="74" rx="13" fill="#1a1d27" stroke="#343744"/>
    <rect x="72" y="383" width="3" height="38" rx="1.5" fill="#e8e7ed"/>
    <circle cx="44" cy="402" r="15" fill="#171a23" stroke="#e8e7ed" stroke-width="1.5"/>
    <text x="44" y="407" text-anchor="middle" fill="#e8e7ed" font-size="14" font-weight="650">04</text>
    <text x="92" y="394" fill="#f2f0f7" font-size="23" font-weight="650">제어권 가져오기</text>
    <text x="92" y="420" fill="#b3b5c3" font-size="18">터미널에 입력하면 제어권이 돌아옵니다.</text>
    <rect x="72" y="452" width="460" height="74" rx="13" fill="#1a1d27" stroke="#343744"/>
    <rect x="72" y="470" width="3" height="38" rx="1.5" fill="#87d9b8"/>
    <circle cx="44" cy="489" r="15" fill="#171a23" stroke="#87d9b8" stroke-width="1.5"/>
    <text x="44" y="494" text-anchor="middle" fill="#87d9b8" font-size="14" font-weight="650">05</text>
    <text x="92" y="481" fill="#f2f0f7" font-size="23" font-weight="650">타임라인 확인</text>
    <text x="92" y="507" fill="#b3b5c3" font-size="18">요청과 명령을 하나의 기록에서 봅니다.</text>
    <text x="28" y="569" fill="#999bac" font-size="12" font-weight="600" letter-spacing="1.15">협업 흐름 · 제어권은 당신에게</text>
  </g>
</svg>
